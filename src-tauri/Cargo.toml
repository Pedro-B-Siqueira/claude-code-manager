[workspace]
members = [".", "crates/fake-claude"]
resolver = "3"

[package]
name = "claude-code-manager"
version = "0.1.0"
description = "Gerenciador leve de sessoes do Claude Code"
edition = "2024"
rust-version = "1.85"
publish = false

[lib]
name = "ccm_lib"
path = "src/lib.rs"

[[bin]]
name = "claude-code-manager"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["std", "alloc"] }
notify-debouncer-mini = "0.7"
log = "0.4"
rusqlite = { version = "0.40", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

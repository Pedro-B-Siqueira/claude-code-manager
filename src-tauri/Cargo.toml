[workspace]
members = [".", "crates/fake-claude"]
resolver = "3"

[package]
name = "claude-code-manager"
version = "0.2.0"
description = "Gerenciador leve de sessoes do Claude Code"
edition = "2024"
rust-version = "1.85"
publish = false

[lib]
name = "ccm_lib"
path = "src/lib.rs"

[[bin]]
name = "claude-code-manager"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["std", "alloc"] }
notify-debouncer-mini = "0.7"
portable-pty = "0.9"
vt100 = "0.16"
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "~2.3.3"
tiny_http = "0.12"
trash = "5"
log = "0.4"
rusqlite = { version = "0.40", features = ["bundled"] }

# Repouso talks to AppKit and LocalAuthentication. Same versions tao/wry already bring in, so no new
# code is downloaded; only the features below are compiled in addition.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSError"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSWindow"] }
block2 = "0.6"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

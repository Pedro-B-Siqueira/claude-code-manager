name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ''
            rust-targets: ''
          - platform: ubuntu-22.04-arm
            args: ''
            rust-targets: ''
    runs-on: ${{ matrix.platform }}
    env:
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Build scripts and the bundler run here; none of them needs the token saved in .git/config.
          persist-credentials: false

      - name: Tag matches the app version
        if: env.IS_TAG == 'true'
        run: node scripts/check-version.mjs "${GITHUB_REF_NAME#v}"

      - name: Linux build dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf build-essential libssl-dev libxdo-dev

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm test

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: npx tauri
          args: ${{ matrix.args }}
          tagName: ${{ env.IS_TAG == 'true' && github.ref_name || '' }}
          releaseName: Claude Code Manager ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: false
          uploadWorkflowArtifacts: ${{ env.IS_TAG != 'true' }}
          releaseBody: |
            Baixe o instalador do seu sistema em **Assets**, logo abaixo.

            - **macOS 14+ (Apple Silicon e Intel):** `.dmg`. O app não tem assinatura da Apple; na primeira vez, libere em Ajustes → Privacidade e Segurança → Abrir mesmo assim.
            - **Linux x86_64 e arm64 (experimental):** `.AppImage` (dê `chmod +x` e execute) ou `.deb` (`sudo apt install ./arquivo.deb`).

            Detalhes no [README](https://github.com/Pedro-B-Siqueira/claude-code-manager#download).
